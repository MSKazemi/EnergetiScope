# Job | CPU-bound | 250m CPU | 256Mi memory
# batch workload — fundamentally different kind from Deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-job-cpu-250m
  namespace: energetiscope-bench
  labels:
    app: energetiscope-bench
    bench-profile: cpu
    bench-cpu: "250m"
    bench-mem: "256Mi"
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 660
  template:
    metadata:
      labels:
        app: energetiscope-bench
        bench-workload: bench-job-cpu-250m
    spec:
      restartPolicy: Never
      containers:
        - name: stressor
          image: alexeiled/stress-ng:latest
          command: ["stress-ng", "--cpu", "1", "--timeout", "300s", "--metrics-brief"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 5
