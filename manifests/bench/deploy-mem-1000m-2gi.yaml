# Deployment | Memory-bound | 1000m CPU | 2Gi memory
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-mem-1000m
  namespace: energetiscope-bench
  labels:
    app: energetiscope-bench
    bench-profile: memory
    bench-cpu: "1000m"
    bench-mem: "2Gi"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energetiscope-bench
      bench-workload: bench-mem-1000m
  template:
    metadata:
      labels:
        app: energetiscope-bench
        bench-workload: bench-mem-1000m
    spec:
      containers:
        - name: stressor
          image: polinux/stress-ng
          command: ["stress-ng", "--vm", "1", "--vm-bytes", "1G", "--timeout", "600s"]
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      terminationGracePeriodSeconds: 5
