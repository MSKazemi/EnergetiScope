name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      # Reproduce locally with: make lint
      - name: Lint
        run: uv run ruff check .

      # Reproduce locally with: make test
      - name: Tests
        run: uv run pytest -q

      # The quickstart in README.md must keep working. This is the claim
      # most visitors check first, so it is a blocking check.
      # Reproduce locally with: python eval/eval_bench_grouped.py
      - name: README quickstart — benchmark reproduces
        run: uv run python eval/eval_bench_grouped.py

      - name: Every shipped module is importable
        run: |
          for f in app/*.py; do
            uv run python -c "import ast,sys;ast.parse(open('$f').read())" || exit 1
          done
